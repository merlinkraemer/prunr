<head>

<title>Prunr — coming soon (v2)</title>

<link rel="apple-touch-icon" href="assets/prunr-icon-128.png" />

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script src="_ds/prunr-design-system-225e080c-0cd9-4949-9a22-e33560758b1f/_ds_bundle.js"></script>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    font-family: var(--font-body); color: var(--body-color); -webkit-font-smoothing: antialiased;
    background: var(--bg);
  }
  * { box-sizing: border-box; }
  @keyframes revealIn { from { opacity: 0; transform: translateY(7px); } to { opacity: 1; transform: none; } }
  .reveal { animation: revealIn 0.28s cubic-bezier(.4,0,.2,1); }

  /* Signup: fixed slot — no layout shift between button, form, success. */
  .signup-root {
    position: relative;
    width: 100%;
    max-width: 466px;
    min-height: 82px; /* 54px row + error reserve */
    display: grid;
  }
  .signup-layer {
    grid-area: 1 / 1;
    align-self: start;
    width: 100%;
    transition:
      opacity 0.26s cubic-bezier(.4,0,.2,1),
      transform 0.26s cubic-bezier(.4,0,.2,1),
      visibility 0.26s step-end;
  }
  .signup-layer--in {
    opacity: 1;
    transform: none;
    visibility: visible;
    pointer-events: auto;
  }
  .signup-layer--out {
    opacity: 0;
    transform: scale(0.985) translateY(3px);
    visibility: hidden;
    pointer-events: none;
  }
  .signup-layer--cta.signup-layer--out { transform: scale(0.97); }
  .signup-layer--form { transform-origin: left center; }
  .signup-success {
    display: inline-flex;
    align-items: center;
    gap: 11px;
    background: var(--accent-soft);
    border-radius: var(--radius-pill);
    padding: 12px 22px 12px 14px;
    box-shadow: var(--shadow-hairline);
    min-height: 54px;
  }

  /* Mobile-only line break inside the hero headline. */
  .m-br { display: none; }

  /* CTA: small lift on hover (glare disabled). */
  .ds-glare { display: none; }
  .cta-nudge { display: inline-block; transition: transform .2s var(--ease); }
  .cta-nudge:hover { transform: translateY(-2px); }

  /* Popover drops open from the menubar. */
  @keyframes popoverOpen { from { opacity: 0; transform: translateY(-10px) scale(.985); } to { opacity: 1; transform: none; } }
  .popover-open { animation: popoverOpen 0.32s cubic-bezier(.4,0,.2,1); transform-origin: top right; }

  /* Hero emojis: very subtle idle motion. */
  @keyframes bugWiggle {
    0%, 90%, 100% { transform: rotate(0) translateX(0); }
    93% { transform: rotate(-7deg) translateX(-1px); }
    96% { transform: rotate(5deg) translateX(1px); }
  }
  @keyframes leafSway {
    0%, 100% { transform: rotate(-3deg); }
    50% { transform: rotate(3deg); }
  }
  .emoji-bug { animation: bugWiggle 5s ease-in-out infinite; transform-origin: 50% 80%; }
  .emoji-leaf { animation: leafSway 4.5s ease-in-out infinite; transform-origin: 50% 90%; }

  @media (prefers-reduced-motion: reduce) {
    .emoji-bug, .emoji-leaf, .popover-open { animation: none; }
    .signup-layer { transition: none; }
    .signup-layer--out { opacity: 0; transform: none; }
  }

  /* Mobile-only app icon above hero headline. */
  .hero-mobile-logo { display: none; }
  .footer-contact { display: none; }
  .footer-github { display: none; }
  .footer-contact-label {
    font-family: var(--font-body); font-weight: 500; font-size: 13px;
    color: var(--body-color); opacity: 0.45;
  }

  /* ---- Tablet: text stacks below; menubar + screenshot stay desktop-style ---- */
  @media (max-width: 1100px) and (min-width: 821px) {
    html, body { overflow: auto; height: auto; }
    .v2-page {
      height: auto !important; min-height: 100vh; overflow: visible !important;
    }
    .v2-page > div:not(.site-menubar):not(.hero-mobile-logo) {
      height: auto !important; min-height: 100vh;
      display: flex !important; flex-direction: column !important;
    }
    .hero-main {
      flex: 1 !important;
      align-items: flex-start !important;
      min-height: 0 !important;
      /* Clear absolute popover: top offset + rendered image height + gap */
      margin-top: calc(34px + clamp(300px, 30vw, 380px) * 1034 / 814 + 32px) !important;
      padding: 0 56px 40px !important;
    }
    .site-footer { flex: none !important; margin-top: auto !important; }
    .hero-subtitle p { max-width: none !important; }
    .hero-cta {
      display: flex !important; justify-content: center !important;
      width: 100% !important;
    }
    .hero-cta > div { margin-left: auto !important; margin-right: auto !important; }
  }

  /* ---- Mobile: full reflow — menubar + screenshot become document flow ---- */
  @media (max-width: 820px) {
    html, body { overflow: auto; height: auto; }
    .v2-page {
      height: auto !important; min-height: 100vh; overflow: visible !important;
      display: flex !important; flex-direction: column !important;
    }
    .v2-page > div:not(.site-menubar):not(.hero-mobile-logo) { display: contents !important; }
    .hero-main { display: contents !important; }
    .hero-body { display: contents !important; }
    .site-menubar { position: static !important; width: 100% !important; }
    .popover-open {
      position: static !important; right: auto !important; top: auto !important;
      width: min(96vw, 600px) !important; max-height: none !important;
      margin: 12px auto 0 !important;
    }
    .hero-subtitle p { max-width: none !important; }
    .hero-cta {
      display: flex !important; flex-direction: column !important;
      align-items: center !important; justify-content: center !important;
      width: 100% !important;
    }
    .hero-cta .signup-root { margin-top: 0 !important; margin-inline: auto !important; }
    .hero-cta .signup-layer--cta { display: flex !important; justify-content: center !important; }
    .site-nav { display: none !important; }
    .hero-mobile-logo {
      display: block !important;
      order: 0;
      padding: 28px 22px 0 !important;
      margin: 0 !important;
    }
    .hero-main h1 {
      order: 1;
      margin: clamp(140px, 24vh, 220px) 0 0 !important;
      padding: 0 22px !important;
    }
    .hero-subtitle { order: 2; padding: 16px 22px 0 !important; }
    .hero-subtitle p { margin-top: 0 !important; }
    .site-menubar { order: 3; margin-top: 48px !important; justify-content: flex-end !important; }
    .mb-items { gap: 22px !important; flex-shrink: 0 !important; }
    .popover-open { order: 4; }
    .hero-cta { order: 5; padding: 16px 22px 48px !important; }
    .site-footer { order: 6; justify-content: center !important; padding: 0 22px 32px !important; }
    .footer-logo { display: none !important; }
    .footer-github { display: none !important; }
    .footer-handle { display: none !important; }
    .footer-contact { display: inline-flex !important; align-items: center; gap: 6px; }
    .hero-main h1 { font-size: clamp(44px, 13vw, 56px) !important; }
    .hero-main h1 span { white-space: normal !important; }
    .m-br { display: inline !important; }
  }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="coming-soon-v2.jsx"></script>
<script type="text/babel">
  (function mount() {
    if (!window.PrunrComingSoonV2 || !window.PrunrDesignSystem_225e08) { setTimeout(mount, 60); return; }
    ReactDOM.createRoot(document.getElementById("root")).render(<window.PrunrComingSoonV2.Page />);
  })();
</script>
</body>
</html>
