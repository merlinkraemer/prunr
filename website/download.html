<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Download Prunr</title>
<link rel="icon" href="assets/favicon.png" type="image/png" />
<link rel="stylesheet" href="_ds/prunr-design-system-225e080c-0cd9-4949-9a22-e33560758b1f/styles.css" />
<style>
  html, body { margin: 0; min-height: 100%; }
  body {
    font-family: var(--font-body); color: var(--body-color); background: var(--bg);
    -webkit-font-smoothing: antialiased;
    display: flex; align-items: center; justify-content: center; padding: 40px 22px;
  }
  .wrap { max-width: 420px; width: 100%; text-align: center; }
  .app-id {
    display: flex; align-items: center; justify-content: center;
    gap: 10px; margin: 0 auto 20px;
  }
  /* icon size=48 → same ratio as landing Wordmark (font = size × 0.8, radius = size × 0.225) */
  .icon { width: 48px; height: 48px; border-radius: 11px; flex-shrink: 0; }
  .logotype {
    font-family: var(--font-heading); font-weight: 700; font-size: 38px;
    color: var(--heading-color); letter-spacing: var(--tracking-heading);
  }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    height: 52px; padding: 0 28px; border-radius: var(--radius-pill);
    background: var(--theme-accent); color: var(--theme-accent-ink);
    font-family: var(--font-body); font-weight: 600; font-size: 16px;
    text-decoration: none; cursor: pointer;
    box-shadow: var(--shadow-hairline); transition: opacity 0.15s;
  }
  .btn.loading { opacity: 0.4; pointer-events: none; }
  .build { margin-top: 14px; font-size: 13px; opacity: 0.38; }
  .err { color: #d92d20; font-size: 14px; margin-top: 14px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="app-id">
    <img class="icon" src="assets/favicon.png" alt="" width="48" height="48" />
    <span class="logotype">Prunr</span>
  </div>
  <a id="dl" class="btn loading" href="#">Download Prunr</a>
  <p id="build" class="build" hidden></p>
  <p id="err" class="err" hidden></p>
</div>
<script>
(function () {
  var REPO = "merlinkraemer/prunr";
  var dl = document.getElementById("dl");
  var build = document.getElementById("build");
  var err = document.getElementById("err");

  fetch("https://api.github.com/repos/" + REPO + "/releases/latest", {
    headers: { Accept: "application/vnd.github+json" },
  })
    .then(function (r) { if (!r.ok) throw new Error(); return r.json(); })
    .then(function (rel) {
      var assets = rel.assets || [];
      var asset = assets.find(function (a) { return /-macos\.dmg$/i.test(a.name); })
               || assets.find(function (a) { return /-macos\.zip$/i.test(a.name) && !/dsym/i.test(a.name); });
      if (!asset) throw new Error();
      dl.href = asset.browser_download_url;
      dl.classList.remove("loading");
      var m = asset.name.match(/build(\d+)/i);
      var parts = [];
      if (rel.tag_name || rel.name) parts.push(rel.tag_name || rel.name);
      if (m) parts.push("build " + m[1]);
      if (parts.length) { build.textContent = parts.join(" · "); build.hidden = false; }
    })
    .catch(function () {
      dl.href = "https://github.com/" + REPO + "/releases/latest";
      dl.classList.remove("loading");
      err.textContent = "Couldn’t find a download — view releases on GitHub.";
      err.hidden = false;
    });
})();
</script>
</body>
</html>
