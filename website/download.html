<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Download Prunr</title>
<link rel="icon" href="assets/favicon.png" type="image/png" />
<link rel="stylesheet" href="_ds/prunr-design-system-225e080c-0cd9-4949-9a22-e33560758b1f/styles.css" />
<style>
  html, body { margin: 0; min-height: 100%; }
  body {
    font-family: var(--font-body); color: var(--body-color); background: var(--bg);
    -webkit-font-smoothing: antialiased;
    display: flex; flex-direction: column; min-height: 100vh;
  }
  /* Logo + CTA + version: vertically centered in the viewport. */
  .main {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center; padding: 40px 22px;
  }
  .app-id {
    display: flex; align-items: center; justify-content: center;
    gap: 10px; margin: 0 0 36px;
  }
  /* App icon a touch smaller than the wordmark. */
  .icon { width: 32px; height: 32px; border-radius: 7px; flex-shrink: 0; }
  .logotype {
    font-family: var(--font-heading); font-weight: 700; font-size: 38px;
    color: var(--heading-color); letter-spacing: var(--tracking-heading);
  }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    height: 52px; padding: 0 28px; border-radius: var(--radius-pill);
    background: var(--theme-accent); color: var(--theme-accent-ink);
    font-family: var(--font-body); font-weight: 600; font-size: 16px;
    text-decoration: none; cursor: pointer;
    box-shadow: var(--shadow-hairline); transition: opacity 0.15s;
  }
  .btn.loading { opacity: 0.4; pointer-events: none; }
  .build { margin-top: 14px; font-size: 13px; opacity: 0.38; }
  .err { color: #d92d20; font-size: 14px; margin-top: 14px; }

  /* Footer — mirrors the landing page. */
  .site-footer {
    flex: none; display: flex; align-items: center; justify-content: center;
    gap: 22px; padding: 0 34px 18px;
  }
  .footer-link {
    display: inline-flex; align-items: center; gap: 6px; text-decoration: none;
    font-family: var(--font-body); font-weight: 500; font-size: 13px;
    color: var(--body-color); opacity: 0.45;
    transition: opacity var(--dur-fast) var(--ease);
  }
  .footer-link:hover { opacity: 0.85; }
  .footer-link svg { display: block; }
</style>
</head>
<body>
<main class="main">
  <div class="app-id">
    <img class="icon" src="assets/favicon.png" alt="" width="32" height="32" />
    <span class="logotype">Prunr</span>
  </div>
  <a id="dl" class="btn loading" href="#">Download Prunr</a>
  <p id="build" class="build" hidden></p>
  <p id="err" class="err" hidden></p>
</main>
<footer class="site-footer">
  <a class="footer-link" href="https://github.com/merlinkraemer/prunr" target="_blank" rel="noopener noreferrer">
    <svg width="15" height="15" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
      <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z" />
    </svg>
    /prunr
  </a>
  <a class="footer-link" href="https://merlins-internet.com" target="_blank" rel="noopener noreferrer">@merlinkraemer</a>
</footer>
<script>
(function () {
  var REPO = "merlinkraemer/prunr";
  var dl = document.getElementById("dl");
  var build = document.getElementById("build");
  var err = document.getElementById("err");

  fetch("https://api.github.com/repos/" + REPO + "/releases/latest", {
    headers: { Accept: "application/vnd.github+json" },
  })
    .then(function (r) { if (!r.ok) throw new Error(); return r.json(); })
    .then(function (rel) {
      var assets = rel.assets || [];
      var asset = assets.find(function (a) { return /-macos\.dmg$/i.test(a.name); })
               || assets.find(function (a) { return /-macos\.zip$/i.test(a.name) && !/dsym/i.test(a.name); });
      if (!asset) throw new Error();
      dl.href = asset.browser_download_url;
      dl.classList.remove("loading");
      var m = asset.name.match(/build(\d+)/i);
      var parts = [];
      if (rel.tag_name || rel.name) parts.push(rel.tag_name || rel.name);
      if (m) parts.push("build " + m[1]);
      if (parts.length) { build.textContent = parts.join(" · "); build.hidden = false; }
    })
    .catch(function () {
      dl.href = "https://github.com/" + REPO + "/releases/latest";
      dl.classList.remove("loading");
      err.textContent = "Couldn’t find a download — view releases on GitHub.";
      err.hidden = false;
    });
})();
</script>
</body>
</html>
